
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GravityLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>GravityLab</h1>
    <p>Interactive Celestial Physics Simulator</p>
</header>

<main class="app-layout">

    <section class="universe-container">
        <canvas id="universe"></canvas>

        <div class="simulation-controls">
            <button id="playPauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>

            <label>
                Speed:
                <input
                    type="range"
                    id="speedSlider"
                    min="0.1"
                    max="5"
                    step="0.1"
                    value="1"
                >
                <span id="speedValue">1x</span>
            </label>

            <label>
                <input
                    type="checkbox"
                    id="trailToggle"
                    checked
                >
                Show Trails
            </label>
        </div>
    </section>

    <aside class="control-panel">

        <h2>Celestial Bodies</h2>

        <button id="addBodyBtn" class="add-button">
            + Add Body
        </button>

        <div id="bodyList"></div>

        <hr>

        <h2>Body Properties</h2>

        <p id="selectedBodyName">
            Select a celestial body
        </p>

        <div id="bodyProperties" class="hidden">

            <label>
                Mass:
                <span id="massValue"></span>
                <input
                    type="range"
                    id="massSlider"
                    min="1"
                    max="20000"
                    step="1"
                >
            </label>

            <label>
                Radius:
                <span id="radiusValue"></span>
                <input
                    type="range"
                    id="radiusSlider"
                    min="3"
                    max="50"
                    step="1"
                >
            </label>

            <label>
                Velocity X:
                <input
                    type="number"
                    id="vxInput"
                    step="0.1"
                >
            </label>

            <label>
                Velocity Y:
                <input
                    type="number"
                    id="vyInput"
                    step="0.1"
                >
            </label>

            <button id="deleteBodyBtn" class="delete-button">
                Delete Body
            </button>

        </div>

    </aside>

</main>

<script src="script.js"></script>

</body>
</html>
